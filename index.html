<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#f4f0ea"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="description" content="Wikilog's — any journey, one book"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="favicon.svg"/>
<link rel="manifest" href="manifest.json"/>
<title>Wikilog's</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f4f0ea;--paper:#fffcf7;--ink:#141414;--muted:#6b6560;--line:#e5dfd6;
  --accent:#2c4a3e;--accent-soft:#e4efe9;--accent-fg:#f7f4ef;
  --warm:#c45c26;--danger:#a61b1b;--radius:16px;
  --serif:"Instrument Serif",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-right:env(safe-area-inset-right,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --dock-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(var(--dock-h) + var(--safe-bottom) + 76px)}
button,input,select,textarea{font:inherit;touch-action:manipulation}
button,.prompt,.chip,.poi-chip,.tab{-webkit-tap-highlight-color:rgba(44,74,62,.12)}
a{color:var(--accent)}
.shell{max-width:760px;margin:0 auto;padding:0 16px 24px}
.top{position:sticky;top:0;z-index:20;background:rgba(244,240,234,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin:0 -16px;padding:12px 16px;padding-top:max(12px,var(--safe-top));display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--serif);font-size:1.35rem;letter-spacing:-.02em}
.logo span{font-size:.7rem;font-family:var(--sans);color:var(--muted);margin-left:8px;font-weight:500;letter-spacing:.04em}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;display:grid;place-items:center;flex:0 0 44px}
.hero-cover{position:relative;margin:16px -16px 0;min-height:220px;background:linear-gradient(160deg,#1a2e26 0%,#2c4a3e 50%,#3d5c4a 100%);color:#fff;overflow:hidden}
.hero-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.hero-cover .inner{position:relative;padding:48px 20px 28px;max-width:760px;margin:0 auto}
.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;font-weight:600}
.display{font-family:var(--serif);font-size:clamp(2rem,6vw,2.75rem);line-height:1.05;margin-top:8px;letter-spacing:-.02em}
.lede{margin-top:12px;font-size:1.05rem;line-height:1.45;opacity:.9;max-width:28em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.15);font-size:12px;margin-top:16px;backdrop-filter:blur(6px)}
.section{margin-top:28px}
.section-title{font-family:var(--serif);font-size:1.5rem;margin-bottom:12px}
.trip-card{display:block;width:100%;text-align:left;border:none;background:var(--paper);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(20,20,20,.04);cursor:pointer;margin-bottom:14px;transition:transform .15s}
.trip-card:active{transform:scale(.99)}
.trip-card .thumb{height:140px;background:linear-gradient(135deg,#2c4a3e,#5a7d6c);position:relative}
.trip-card .thumb img{width:100%;height:100%;object-fit:cover}
.trip-card .body{padding:16px 18px 18px}
.trip-card h3{font-family:var(--serif);font-size:1.45rem;font-weight:400}
.meta{color:var(--muted);font-size:13px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:none;background:var(--accent);color:var(--accent-fg);font-weight:600;cursor:pointer;font-size:15px}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-soft{background:var(--accent-soft);color:var(--accent)}
.btn-sm{min-height:40px;padding:0 14px;font-size:13px}
.btn-block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel{background:var(--paper);border-radius:var(--radius);padding:18px;margin-top:12px;border:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px;background:var(--paper);border-radius:999px;border:1px solid var(--line);margin:16px 0;scrollbar-width:none}
.tab{flex:0 0 auto;border:none;background:transparent;padding:10px 14px;min-height:40px;border-radius:999px;color:var(--muted);cursor:pointer;font-size:13px;font-weight:500}
.tab.active{background:var(--ink);color:#fff}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
input,select,textarea{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:100px;resize:vertical}
.field{margin-bottom:14px}
.list{list-style:none}
.list li{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.list li:last-child{border-bottom:none}
.check{width:22px;height:22px;margin-top:2px;accent-color:var(--accent)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--bg);border-radius:14px;padding:14px 10px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:1.5rem;font-weight:400}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent)}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600}
.prompt{display:inline-flex;align-items:center;min-height:36px;margin:4px 6px 0 0;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:12px;cursor:pointer}
#map{height:320px;border-radius:var(--radius);border:1px solid var(--line);margin-top:8px}
.map-hero{height:min(42vh,340px);margin:0 -16px;border-radius:0;border:none}
.entry{border-left:3px solid var(--accent);padding:4px 0 4px 16px;margin:18px 0}
.entry .when{font-size:12px;color:var(--muted);letter-spacing:.04em}
.entry h4{font-family:var(--serif);font-size:1.25rem;font-weight:400;margin-top:4px}
.fab{position:fixed;right:max(16px,var(--safe-right));bottom:calc(var(--dock-h) + var(--safe-bottom) + 12px);z-index:25;width:56px;height:56px;border-radius:50%;border:none;background:var(--ink);color:#fff;font-size:28px;box-shadow:0 8px 24px rgba(0,0,0,.22);cursor:pointer}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,252,247,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:4px 6px max(6px,var(--safe-bottom));display:flex;justify-content:space-around;box-shadow:0 -6px 24px rgba(20,20,20,.05)}
.dock button{flex:1;border:none;background:transparent;min-height:48px;padding:8px 4px;border-radius:14px;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.01em}
.dock button.on{background:var(--accent-soft);color:var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal,.sheet{background:var(--paper);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:min(92dvh,100%);overflow:hidden;padding:8px 0 0;display:flex;flex-direction:column;overscroll-behavior:contain}
.modal h2,.sheet h2{font-family:var(--serif);font-size:1.5rem;margin-bottom:14px;font-weight:400}
.toast{position:fixed;left:50%;bottom:calc(var(--dock-h) + var(--safe-bottom) + 76px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;z-index:60;max-width:90%}
.hidden{display:none!important}
.empty{text-align:center;padding:36px 16px 28px;color:var(--muted)}
.empty .ill{font-size:42px;margin-bottom:10px;opacity:.55}
.empty p{max-width:22em;margin:0 auto;line-height:1.45}
.mode-switch{display:flex;gap:6px;margin:12px 0}
.mode-switch button{flex:1;border:1px solid var(--line);background:var(--paper);padding:10px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:500}
.mode-switch button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

.share-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.storyline{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.story-clip{flex:0 0 72%;max-width:280px;scroll-snap-align:start;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.story-clip video{width:100%;aspect-ratio:9/16;object-fit:cover;background:#000;display:block;max-height:360px}
.video-wrap{position:relative;display:block;border-radius:12px;overflow:hidden;background:#000}
.video-wrap video{width:100%;display:block;max-height:360px;border-radius:0}
.wm-badge{position:absolute;right:10px;bottom:10px;z-index:2;background:rgba(20,20,20,.72);color:#fffcf7;font:600 12px DM Sans,system-ui,sans-serif;padding:6px 10px;border-radius:8px;pointer-events:none;letter-spacing:.02em}
.wm-badge small{display:block;font-weight:500;font-size:9px;opacity:.85;margin-top:1px}
.cam-overlay{position:fixed;inset:0;z-index:100;background:#0a0a0a;display:flex;flex-direction:column;color:#fff}
.cam-overlay.hidden{display:none}
.cam-top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:rgba(0,0,0,.55)}
.cam-top .cam-timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;letter-spacing:.04em}
.cam-top button{background:transparent;border:0;color:#fff;font-size:15px;padding:8px 12px;cursor:pointer}
.cam-stage{flex:1;position:relative;min-height:0;background:#111;display:flex;align-items:center;justify-content:center}
.cam-stage video{width:100%;height:100%;object-fit:cover;background:#000}
.cam-stage .wm-badge{right:14px;bottom:14px}
.cam-bottom{flex:0 0 auto;padding:16px 24px;padding-bottom:max(20px,env(safe-area-inset-bottom));background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:space-around;gap:12px}
.cam-bottom .cam-side{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;font-size:12px;font-weight:600;cursor:pointer;display:grid;place-items:center}
.cam-shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:#e11;cursor:pointer;box-shadow:0 0 0 3px rgba(0,0,0,.35);position:relative}
.cam-shutter.rec{background:#111;border-color:#e11}
.cam-shutter.rec::after{content:"";position:absolute;inset:22px;background:#e11;border-radius:6px}
.cam-hint{text-align:center;font-size:12px;opacity:.75;padding:0 16px 8px;background:rgba(0,0,0,.75)}
.story-clip .cap{padding:10px 12px}
.story-clip .cap strong{display:block;font-size:.95rem}
.story-tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:0 0 auto;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.share-row .btn{flex:1;min-width:100px}
.story-badge{font-size:11px;color:var(--warm);font-weight:600}
#storyPreview{width:100%;max-height:200px;border-radius:12px;margin-top:8px;background:#000}

.ver-chip{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:600;letter-spacing:.03em;vertical-align:middle;margin-left:8px}
.sheet-handle{width:40px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 8px;flex:0 0 auto}
.sheet-scroll{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 20px 12px;flex:1;min-height:0}
.sheet-actions{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;padding:12px 20px max(16px,var(--safe-bottom));background:var(--paper);border-top:1px solid var(--line);position:sticky;bottom:0}
.sheet-actions-row{flex-direction:row;justify-content:flex-end;align-items:center}
.sheet-actions .btn{min-height:48px}
.qc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.qc-grid button{min-height:96px;border:1px solid var(--line);background:var(--bg);border-radius:16px;cursor:pointer;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.qc-grid button .qc-ico{font-size:26px;line-height:1}
.mem-card{display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin:10px 0;align-items:stretch}
.mem-thumb{width:80px;flex:0 0 80px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#2c4a3e,#5a7d6c);min-height:80px}
.mem-thumb img{width:100%;height:100%;object-fit:cover;min-height:80px;display:block}
.mem-body{flex:1;min-width:0}
.mem-body h4{font-family:var(--serif);font-size:1.15rem;font-weight:400;margin-top:2px}
.mem-body .when{font-size:12px;color:var(--muted);letter-spacing:.02em}
.mem-del{width:36px;height:36px;flex:0 0 36px;border:none;background:transparent;color:var(--muted);font-size:20px;border-radius:10px;cursor:pointer;line-height:1}
.mem-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.one-liner{margin-top:4px;color:var(--muted);font-size:13px;line-height:1.4}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;margin:4px 4px 0 0}
.tag.warm{background:#f3e4d8;color:var(--warm)}
.poi-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:12px;cursor:pointer}
.poi-chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.poi-pin{background:transparent;border:none}
.poi-pin span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.empty-actions{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:14px}
.empty-actions .btn{min-width:min(100%,240px)}
.log-toolbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.log-prompts{display:flex;flex-wrap:wrap;gap:0;flex:1;min-width:0}
.camp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#e11;display:inline-block;margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.mode-switch{margin:8px 0 0}
.mode-switch button{padding:8px;font-size:12px}
.tabs{margin:10px 0 12px;padding:4px}
.tab{padding:8px 12px;font-size:12px}
.hero-cover.slim{min-height:140px}
.hero-cover.slim .inner{padding:28px 20px 18px}
.trip-places .meta{margin-top:2px}
@media print{.top,.dock,.fab,.tabs,.mode-switch,.toast,.modal-bg,.no-print{display:none!important}body{background:#fff;padding:0}.shell{max-width:none}.panel{border:none;box-shadow:none}}

/* Community / social */
.demo-banner{display:flex;align-items:center;gap:8px;margin:8px 0 0;padding:6px 6px 6px 12px;border-radius:12px;background:rgba(44,74,62,.06);color:var(--muted);font-size:12px;font-weight:500;line-height:1.35;border:1px solid transparent}
.demo-banner span{flex:1;min-width:0}
.demo-dismiss{width:40px;height:40px;border:none;background:transparent;border-radius:10px;color:var(--muted);font-size:20px;cursor:pointer;flex:0 0 40px;line-height:1}
.badge-pub{background:var(--accent-soft);color:var(--accent)}
.badge-priv{background:#eee;color:var(--muted)}
.badge-close{background:#f3e8d8;color:#7a5a2e}
.badge-followers{background:#e4eef6;color:#2a5570}
.audience-ladder{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.audience-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg)}
.audience-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.audience-opt input{margin-top:3px;flex:0 0 auto}
.audience-opt strong{display:block;font-size:13px}
.fork-pick{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.fork-pick input{margin-top:3px}
.share-url{font-size:12px;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.soc-tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--paper);border-radius:999px;border:1px solid var(--line);margin:12px 0;scrollbar-width:none}
.soc-tabs button{flex:0 0 auto;border:none;background:transparent;padding:8px 12px;min-height:40px;border-radius:999px;color:var(--muted);cursor:pointer;font-size:12px;font-weight:500}
.soc-tabs button.on{background:var(--ink);color:#fff}
.feed-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:10px 0}
.feed-card .who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:18px;flex:0 0 36px}
.avatar.lg{width:56px;height:56px;font-size:28px}
.react-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.react-btn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;min-height:36px;font-size:12px;cursor:pointer}
.react-btn.on{border-color:var(--accent);background:var(--accent-soft)}
.star-row{display:flex;gap:4px}
.star-row button{border:none;background:transparent;font-size:22px;cursor:pointer;opacity:.35;min-width:36px;min-height:36px}
.star-row button.on{opacity:1}
.dm-bubble{max-width:80%;padding:10px 14px;border-radius:16px;margin:6px 0;font-size:14px;line-height:1.4}
.dm-bubble.me{background:var(--accent);color:var(--accent-fg);margin-left:auto;border-bottom-right-radius:4px}
.dm-bubble.them{background:var(--bg);border:1px solid var(--line);margin-right:auto;border-bottom-left-radius:4px}
.dm-thread{display:flex;flex-direction:column;min-height:40vh;padding-bottom:8px}
.dm-compose{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding:8px 0 max(8px,var(--safe-bottom))}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.type-grid button{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 10px;cursor:pointer;text-align:left;font-size:13px;min-height:64px}
.type-grid button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.type-grid button strong{display:block;font-size:14px;margin-bottom:2px}
.pub-view .highlight{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.comment{padding:10px 0;border-bottom:1px solid var(--line)}
.profile-card{display:flex;gap:12px;align-items:flex-start}

@media (max-width:560px){
  .shell{padding:0 14px 20px}
  .top{margin:0 -14px}
  .map-hero{margin:0 -14px}
  .trip-card .thumb{height:120px}
  .trip-card .body{padding:14px 14px 16px}
  .mem-card{gap:10px;padding:10px;margin:8px 0}
  .mem-thumb{width:68px;flex:0 0 68px;min-height:68px;border-radius:10px}

function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

const IDB_NAME="wikilogs_media_v1";
function openMediaDB(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("blobs"))db.createObjectStore("blobs");};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function mediaPut(id,blob){const db=await openMediaDB();return new Promise((res,rej)=>{const tx=db.transaction("blobs","readwrite");tx.objectStore("blobs").put(blob,id);tx.oncomplete=()=>res(id);tx.onerror=()=>rej(tx.error);});}
async function mediaGet(id){const db=await openMediaDB();return new Promise((res,rej)=>{const q=db.transaction("blobs").objectStore("blobs").get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error);});}
async function mediaUrl(id){const b=await mediaGet(id);return b?URL.createObjectURL(b):null;}
async function hydrateVideos(root){for(const v of (root||document).querySelectorAll("video[data-media]")){if(v.dataset.hydrated)continue;const id=v.getAttribute("data-media");if(!id)continue;try{const u=await mediaUrl(id);if(u){v.src=u;v.dataset.hydrated="1";}}catch(e){}}}

function allStoryClips(t){
  const out=[];
  (t.storyline||[]).forEach(c=>out.push({...c,source:"storyline"}));
  (t.days||[]).forEach(d=>{
    if(d.story)out.push({id:d.id+"-main",media:d.story,title:d.title||"Journal clip",place:d.place,date:d.date,dayId:d.id,source:"journal"});
    (d.storyClips||[]).forEach(c=>out.push({...c,dayId:d.id,date:d.date||c.date,source:"journal"}));
  });
  out.sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.title||"").localeCompare(b.title||""));

function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dLat=r(b.lat-a.lat),dLng=r(b.lng-a.lng);const x=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(x));}

  if(!t)return`<div class="top"><button class="icon-btn" id="socBackShare">←</button><div class="logo">Shared link</div></div>
  <div class="empty"><div class="ill">🔗</div><p>This share link is invalid or was revoked.</p>
  <button class="btn btn-sm" id="socBackShare2">Back home</button></div>`;
  S.forkSource=t;S.socTripId=t.id;
  return sharedTripBody(t,{title:"Shared link",backId:"socBackShare"});
}
function profileView(id){
  const a=C();const p=a&&a.profile(id);
  if(!p)return`<div class="top"><button class="icon-btn" id="socBack">←</button></div><div class="empty">Not found</div>`;
  const following=a.isFollowing(p.id);const isMe=p.id===a.me().id;
  const trips=a.publicTrips().filter(t=>t.ownerId===p.id);
  return`<div class="top"><button class="icon-btn" id="socBack">←</button><div class="logo">Profile</div></div>
  <div class="panel profile-card" style="margin-top:12px"><div class="avatar lg">${p.avatar||"👤"}</div>
  <div style="flex:1"><strong>${esc(p.displayName)}</strong><div class="meta">${esc(p.homeBase||"")}</div>
  <p style="margin-top:8px">${esc(p.bio||"")}</p>
  <div class="meta" style="margin-top:8px">Following ${a.followingIds(p.id).length} · Followers ${a.followersIds(p.id).length}</div>
  <div class="row" style="margin-top:10px">${isMe?`<span class="badge">You</span>`:`
  <button class="btn btn-sm ${following?"btn-ghost":""}" data-follow="${p.id}">${following?"Following":"Follow"}</button>
  <button class="btn btn-ghost btn-sm" data-dm="${p.id}">Message</button>`}</div></div></div>

function dmThreadView(){

    const m=AUDIENCE_META[id];

function tab(t){
  if(S.tab==="story")return tabStory(t);
  if(S.tab==="map")return tabMap(t);
  if(S.tab==="log")return tabLog(t);
  if(S.tab==="pack")return tabPack(t);
  if(S.tab==="spend")return tabSpend(t);
  if(S.tab==="docs")return tabDocs(t);
  if(S.tab==="book")return tabBook(t);
  return"";
}

function memCard(t,d){
  const thumb=(d.photos&&d.photos[0])?`<img src="${d.photos[0]}" alt=""/>`:"";
  const spend=daySpend(t,d.date);
  const title=d.title||d.campName||d.place||(d.kind==="checkin"?"Check-in":d.kind==="voice"?"Voice note":d.kind==="photo"?"Photos":"Moment");
  const line=oneLiner(d.notes||d.fuelNote||d.wildlife||"");
  const chips=[
    d.poiType?`<span class="tag">${esc(poiLabel(d.poiType))}</span>`:"",
    d.campName?`<span class="tag">${esc(d.campName)}</span>`:"",
    d.km?`<span class="tag">${esc(d.km)} km</span>`:"",
    d.fuelNote?`<span class="tag">Fuel ${esc(d.fuelNote)}</span>`:"",
    d.wildlife?`<span class="tag">${esc(d.wildlife)}</span>`:"",
    spend?`<span class="tag warm">${spend.toFixed(0)} ${esc(t.currency||"")}</span>`:""
  ].join("")+campChips(d.campsite);
  return`<article class="mem-card" data-open-day="${d.id}">
  <div class="mem-thumb">${thumb}</div>
  <div class="mem-body">
    <div class="row-between"><div class="when">${esc(d.date)} · ${esc(d.time||"")} ${d.place?"· "+esc(d.place):""}</div>
    <button class="mem-del" data-del-day="${d.id}" aria-label="Delete entry">×</button></div>
    <h4>${esc(title)}</h4>
    ${line?`<p class="one-liner">${esc(line)}</p>`:""}
    <div class="mem-chips">${chips}</div>
    ${d.voice?`<audio controls src="${d.voice}" style="width:100%;margin-top:10px"></audio>`:""}
    ${d.story?`<div class="story-badge" style="margin-top:8px">Video clip</div><div class="video-wrap" style="margin-top:6px"><video data-media="${String(d.story).startsWith("idb:")?String(d.story).slice(4):""}" src="${String(d.story).startsWith("idb:")?"":d.story}" controls playsinline webkit-playsinline preload="metadata"></video><div class="wm-badge">Wikilog's<small>any journey, one book</small></div></div>`:""}
    ${(d.photos||[]).length>1?`<div class="photo-grid">${d.photos.slice(0,6).map(p=>`<img src="${p}" alt=""/>`).join("")}</div>`:""}
    <div class="share-row no-print">
    ${d.story?`<button class="btn btn-soft btn-sm" data-share-story="${d.id}">Share video · Wikilog's</button>`:((d.photos||[]).length?`<button class="btn btn-soft btn-sm" data-share-day="${d.id}">Share photo card</button>`:"")}
    </div>
  </div>
  </article>`;
}

      try{
        newStream=await navigator.mediaDevices.getUserMedia({
          video:{facingMode:nextFacing},
          audio:!!resumeRecording
        });
      }catch(e){lastErr=e;}
    }

    // 3) Cycle every deviceId until one works and differs
    if(!newStream&&list.length){
      for(var i=0;i<list.length;i++){
        try{
          newStream=await navigator.mediaDevices.getUserMedia({
            video:{deviceId:{exact:list[i].deviceId}},
            audio:!!resumeRecording
          });
          break;
        }catch(e){lastErr=e;}
      }
    }

    if(!newStream){
      console.error(lastErr);
      toast("Could not open other camera");
      setMsg("Flip failed");
      // try restore any camera
      try{
        _storyStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
        if(previewEl){previewEl.srcObject=_storyStream;await previewEl.play().catch(function(){});}
        setMsg("Camera restored");
      }catch(e2){}
      return;
    }

    _storyFacing=nextFacing;
    _storyStream=newStream;
    if(previewEl){
      previewEl.srcObject=newStream;
      previewEl.muted=true;
      previewEl.playsInline=true;
      previewEl.setAttribute("playsinline","");
      try{await previewEl.play();}catch(e){}
    }
    var name=_storyFacing==="user"?"Front":"Back";
    if(fl)fl.textContent=name;
    setMsg(name+" camera");
    toast(name+" camera");

    if(resumeRecording){
      // Auto-restart recording on the new camera so user isn't stuck
      try{
        await startStoryRec(previewEl,statusEl,_storyFacing);
        setMsg("Recording "+name+"…");
        toast("Recording on "+name+" camera");
        // sync shutter UI if full-screen camera open
        var shutter=document.getElementById("camShutter");
        if(shutter)shutter.classList.add("rec");
        _camRecording=true;
      }catch(e){
        toast("Camera flipped — press Record again");
        setMsg(name+" — press Record");
      }
    }
  }catch(e){
    console.error("flip fatal",e);
    toast("Flip failed");
    setMsg("Flip failed");
  }
}
async function startStoryRec(previewEl,statusEl,facing){
  try{
    if(facing) _storyFacing=facing;
    if(_storyRecorder&&_storyRecorder.state!=="inactive"){
      try{_storyRecorder.stop();}catch(e){}
    }
    hardStopWmPipeline();
    if(_storyStream){
      try{_storyStream.getTracks().forEach(function(t){t.stop();});}catch(e){}
      _storyStream=null;
    }
    try{if(window._storyTimer)clearTimeout(window._storyTimer);if(window._storyTick)clearInterval(window._storyTick);}catch(e){}
    _storyStream=await getCameraStream(_storyFacing, true);
    // Record directly from camera (reliable on Android). Watermark shows as on-screen badge + share caption.
    var recordStream=_storyStream;
    if(previewEl){
      previewEl.srcObject=_storyStream;
      previewEl.muted=true;previewEl.playsInline=true;
      previewEl.classList.remove("hidden");
      previewEl.controls=false;
      try{await previewEl.play();}catch(e){}
    }
    _storyChunks=[];
    var cands=["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm","video/mp4"];
    var mime="";
    for(var ci=0;ci<cands.length;ci++){
      try{if(MediaRecorder.isTypeSupported(cands[ci])){mime=cands[ci];break;}}catch(e){}
    }
    try{
      _storyRecorder=mime?new MediaRecorder(recordStream,{mimeType:mime,videoBitsPerSecond:1600000}):new MediaRecorder(recordStream);
    }catch(e){
      _storyRecorder=new MediaRecorder(recordStream);
    }
    _storyMime=_storyRecorder.mimeType||mime||"video/webm";
    _storyRecorder.ondataavailable=function(e){if(e.data&&e.data.size)_storyChunks.push(e.data);};
    _storyRecorder.start(250);
    var camLabel=_storyFacing==="user"?"Front":"Back";
    var left=180;
    if(statusEl)statusEl.textContent="Recording "+camLabel+"… "+left+"s left";
    window._storyTick=setInterval(function(){
      left--;
      if(left>=0&&statusEl)statusEl.textContent="Recording "+camLabel+"… "+left+"s left";
    },1000);
    window._storyTimer=setTimeout(function(){stopStoryRec(previewEl,statusEl);},180000);
  }catch(e){
    console.error(e);
    toast("Camera permission needed");
    if(statusEl)statusEl.textContent="Camera blocked";
    throw e;
  }
}

let _camResolve=null,_camRecording=false,_camSeconds=0,_camTick=null;
function fmtCamTime(sec){
  var m=Math.floor(sec/60),s=sec%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function closePhoneCamera(){
  try{if(_camTick)clearInterval(_camTick);}catch(e){}
  _camTick=null;_camRecording=false;_camSeconds=0;
  var ov=document.getElementById("camOverlay");
  if(ov){ov.classList.add("hidden");ov.setAttribute("aria-hidden","true");}
  var v=document.getElementById("camVideo");
  if(v){try{v.srcObject=null;}catch(e){}}
}
function openPhoneCamera(){
  return new Promise(function(resolve){
    _camResolve=resolve;
    var ov=document.getElementById("camOverlay");
    var video=document.getElementById("camVideo");
    var timer=document.getElementById("camTimer");
    var shutter=document.getElementById("camShutter");
    var hint=document.getElementById("camHint");
    var facingLbl=document.getElementById("camFacingLbl");
    if(!ov||!video){resolve(null);return;}

    window._pendingStoryBlob=null;
    _camRecording=false;_camSeconds=0;
    if(timer)timer.textContent="00:00";
    if(shutter)shutter.classList.remove("rec");
    if(hint)hint.textContent="Flip · Record · max 3 min";
    if(facingLbl)facingLbl.textContent=_storyFacing==="user"?"Front":"Back";
    ov.classList.remove("hidden");
    ov.setAttribute("aria-hidden","false");

    // Open camera preview — simple + reliable
    (async function(){
      try{
        if(_storyStream){try{_storyStream.getTracks().forEach(function(t){t.stop();});}catch(e){}_storyStream=null;}
        hardStopWmPipeline();
        // Simplest path first for open reliability
        try{
          _storyStream=await getCameraStream(_storyFacing,false);
        }catch(e1){
          _storyStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
          _storyFacing="environment";
        }
        video.srcObject=_storyStream;
        video.muted=true;
        video.playsInline=true;
        video.setAttribute("playsinline","");
        video.setAttribute("webkit-playsinline","");
        try{await video.play();}catch(e){}
        if(hint)hint.textContent=(_storyFacing==="user"?"Front":"Back")+" ready";
        if(facingLbl)facingLbl.textContent=_storyFacing==="user"?"Front":"Back";
      }catch(e){
        console.error(e);
        toast("Camera blocked — allow permission");
        if(hint)hint.textContent="Camera blocked";
      }
    })();

    async function onFlip(){
      try{
        await switchStoryCamera(video,hint);
        if(facingLbl)facingLbl.textContent=_storyFacing==="user"?"Front":"Back";
      }catch(e){toast("Flip failed");}
    }
    async function onShutter(){
      if(!_camRecording){
        window._pendingStoryBlob=null;
        _storyChunks=[];
        try{
          await startStoryRec(video,hint,_storyFacing);
        }catch(e){toast("Could not record");return;}
        _camRecording=true;
        if(shutter)shutter.classList.add("rec");
        _camSeconds=0;
        if(timer)timer.textContent="00:00";
        if(_camTick)clearInterval(_camTick);
        _camTick=setInterval(function(){
          _camSeconds++;
          if(timer)timer.textContent=fmtCamTime(_camSeconds);
          if(_camSeconds>=180) onShutter();
        },1000);
        if(hint)hint.textContent="Recording… tap to stop";
      }else{
        if(_camTick){clearInterval(_camTick);_camTick=null;}
        _camRecording=false;
        if(shutter)shutter.classList.remove("rec");
        var blob=null;
        try{blob=await stopStoryRec(video,hint);}catch(e){}
        if(blob){
          window._pendingStoryBlob=blob;
          if(hint)hint.textContent="Saved";
          var r=_camResolve;_camResolve=null;
          setTimeout(function(){
            closePhoneCamera();
            if(r)r(blob);
          },250);
        }else{
          if(hint)hint.textContent="No clip — try again";
        }
      }
    }
    function onClose(){
      if(_camRecording){
        try{stopStoryRec(video,hint);}catch(e){}
      }
      var r=_camResolve;_camResolve=null;
      closePhoneCamera();
      hardStopWmPipeline();
      if(_storyStream){try{_storyStream.getTracks().forEach(function(t){t.stop();});}catch(e){}_storyStream=null;}
      if(r)r(window._pendingStoryBlob||null);
    }
    function onPick(){
      var f=document.getElementById("camFile");
      if(f)f.click();
    }
    function onFile(e){
      var f=e.target.files&&e.target.files[0];
      if(!f)return;
      if(f.size>80e6){toast("Video too large");return;}
      window._pendingStoryBlob=f;
      var r=_camResolve;_camResolve=null;
      closePhoneCamera();
      if(r)r(f);
    }

    document.getElementById("camFlipBtn").onclick=onFlip;
    document.getElementById("camShutter").onclick=onShutter;
    document.getElementById("camClose").onclick=onClose;
    document.getElementById("camPickBtn").onclick=onPick;
    var fl=document.getElementById("camFacingLbl");
    if(fl)fl.onclick=onFlip;
    var file=document.getElementById("camFile");
    if(file)file.onchange=onFile;
  });
}

function stopStoryRec(previewEl,statusEl){
  return new Promise(function(res){
    try{if(window._storyTimer)clearTimeout(window._storyTimer);if(window._storyTick)clearInterval(window._storyTick);}catch(e){}
    if(!_storyRecorder||_storyRecorder.state==="inactive"){res(window._pendingStoryBlob||null);return;}
    _storyRecorder.onstop=function(){
      var type=_storyMime||(_storyChunks[0]&&_storyChunks[0].type)||"video/webm";
      var blob=new Blob(_storyChunks,{type:type});
      hardStopWmPipeline();
      if(_storyStream){_storyStream.getTracks().forEach(function(t){t.stop();});_storyStream=null;}
      previewEl.srcObject=null;
      if(blob.size){
        previewEl.src=URL.createObjectURL(blob);
        previewEl.muted=false;previewEl.controls=true;
        window._pendingStoryBlob=blob;
        if(statusEl)statusEl.textContent="Ready ("+(blob.size/1e6).toFixed(1)+" MB) · "+(_storyFacing==="user"?"Front":"Back");
      }else if(statusEl)statusEl.textContent="No video captured";
      res(blob.size?blob:null);
    };
    try{_storyRecorder.requestData();}catch(e){}
    try{_storyRecorder.stop();}catch(e){res(null);}
  });
}

function forkIntoDraft(source){
  if(!source){toast("Nothing to fork");return;}
  const sel=S.forkSel||{days:{},stops:{}};
  const dayIds=Object.keys(sel.days||{}).filter(k=>sel.days[k]);
  const stopIds=Object.keys(sel.stops||{}).filter(k=>sel.stops[k]);
  const allDays=source.days||[];
  const allStops=source.destinations||[];
  let pickDays=allDays.filter(d=>dayIds.includes(d.id));
  let pickStops=allStops.filter(d=>stopIds.includes(d.id));
  if(!pickDays.length&&!pickStops.length){
    // nothing selected → copy everything available
    pickDays=allDays.slice();
    pickStops=allStops.length?allStops.slice():(source.places||[]).map((n,i)=>({id:"pl_"+i,name:n,country:"",poiType:"",notes:""}));
  }
  const nt=buildNewTrip({

    endDate:source.endDate||""
  });

  nt.days=pickDays.map(d=>blankDay({

    poiType:d.poiType||"",kind:d.kind||"note",campName:d.campName||"",
    photos:[],voice:null,story:null
  }));
  nt.destinations=pickStops.map(d=>migratePlace({
    id:uid("d"),name:d.name||"",country:d.country||"",notes:d.notes||"",
    lat:d.lat??null,lng:d.lng??null,poiType:d.poiType||"",
    campsite:d.campsite?Object.assign(emptyCamp(),d.campsite):emptyCamp(),stay:null
  }));
  if(!nt.destinations.length&&(source.places||[]).length&&!pickDays.length){
    nt.destinations=(source.places||[]).map(n=>migratePlace({id:uid("d"),name:n,country:"",notes:"",poiType:"",campsite:emptyCamp(),stay:null}));
  }
  S.trips.unshift(nt);save();

  S.socView=null;S.shareToken=null;S.socTripId=null;
  if(location.hash&&location.hash.indexOf("share=")>=0)history.replaceState(null,"",location.pathname+location.search);

}

async function addPhotosGrouped(files, forceDate){
  const t=T();if(!t||!files.length)return 0;
  const groups={};
  for(const f of files){
    const key=forceDate||fileDay(f);
    (groups[key]=groups[key]||[]).push(f);
  }
  let n=0;
  for(const [date,flist] of Object.entries(groups)){
    const photos=[];
    for(const f of flist){try{photos.push(await fileURL(f));n++;}catch(e){}}
    if(!photos.length)continue;
    const bucket=findDayBucket(t,date);
    if(bucket){bucket.photos=(bucket.photos||[]).concat(photos);if(!bucket.kind||bucket.kind==="note"){/* keep */}}
    else{t.days.push(blankDay({date,title:photos.length>1?"Photos":"Photo",kind:"photo",photos,notes:""}));}
  }
  save();render();
  return n;
}

let _voiceRec=null,_voiceChunks=[],_voiceStream=null;
function stopVoice(){
  return new Promise(res=>{
    try{if(_voiceRec&&_voiceRec.state!=="inactive"){
      _voiceRec.onstop=()=>{
        if(_voiceStream){try{_voiceStream.getTracks().forEach(t=>t.stop());}catch(e){}}
        _voiceStream=null;
        const blob=new Blob(_voiceChunks,{type:(_voiceChunks[0]&&_voiceChunks[0].type)||"audio/webm"});
        res(blob.size?blob:null);
      };
      try{_voiceRec.stop();}catch(e){res(null);}
    }else res(null);}catch(e){res(null);}
  });
}
async function qcVoice(){
  sheet(`<h2>Voice</h2>
    <p class="meta" id="vStatus">Tap record — stop saves to today.</p>
    <div class="sheet-actions">
    <button class="btn btn-block" id="vRec">Record</button>
    <button class="btn btn-ghost btn-block" id="vFile">Pick audio file</button>
    <button class="btn btn-ghost btn-block" id="qcCancel">Cancel</button></div>`);
  document.getElementById("qcCancel").onclick=()=>{stopVoice();closeSheet();};
  document.getElementById("vFile").onclick=async()=>{
    const files=await pickFiles({accept:"audio/*",multiple:false});
    if(!files[0])return;
    const voice=await fileURL(files[0]);
    patch(t=>t.days.push(blankDay({title:"Voice note",kind:"voice",voice,notes:""})));
    closeSheet();S.tab="log";render();toast("Voice saved");
  };
  document.getElementById("vRec").onclick=async()=>{
    const btn=document.getElementById("vRec"),st=document.getElementById("vStatus");
    if(_voiceRec&&_voiceRec.state==="recording"){
      const blob=await stopVoice();
      if(!blob){toast("No audio");return;}
      const voice=await fileURL(new File([blob],"note.webm",{type:blob.type||"audio/webm"}));
      patch(t=>t.days.push(blankDay({title:"Voice note",kind:"voice",voice,notes:""})));
      closeSheet();S.tab="log";render();toast("Voice saved");
      return;
    }
    try{
      _voiceStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
      _voiceChunks=[];
      _voiceRec=new MediaRecorder(_voiceStream);
      _voiceRec.ondataavailable=e=>{if(e.data&&e.data.size)_voiceChunks.push(e.data);};
      _voiceRec.start();
      btn.textContent="Stop & save";
      if(st)st.innerHTML='<span class="rec-dot"></span>Recording… tap stop';
    }catch(e){
      toast("Mic blocked — pick a file");
    }
  };
}

  <div class="field"><label>Headline</label><input id="jH" value="${esc(pre||"")}"/></div>
  <div class="field"><label>Place</label><input id="jP" placeholder="Neighbourhood, hotel, camp…"/></div>
  <div class="field"><label>POI type</label>${poiChipsHTML("")}</div>
  <div class="row"><div class="field" style="flex:1"><label>Stay / camp name</label><input id="jCamp"/></div>
  <div class="field" style="flex:1"><label>Km</label><input id="jKm" type="number" inputmode="decimal"/></div></div>
  <div class="row"><div class="field" style="flex:1"><label>Fuel</label><input id="jFuel"/></div>
  <div class="field" style="flex:1"><label>Wildlife</label><input id="jWild"/></div></div>
  <div class="field"><label>Notes</label><textarea id="jN"></textarea></div>
  <p class="meta" style="margin:4px 0 8px">Camp / stay details (optional)</p>
  ${campFieldsHTML(emptyCamp(),"jC_")}
  <div class="field"><label>Photos</label><input type="file" id="jPh" accept="image/*" multiple capture="environment"/></div>
  <div class="field"><label>Voice</label><input type="file" id="jV" accept="audio/*" capture/></div>
  <div class="field"><label>Video</label>
  <button type="button" class="btn btn-soft" id="jStoryStart" style="width:100%">Open camera — record / flip / gallery</button>
  <p class="meta" id="jStoryStatus">Full-screen camera · max 3 min · Wikilog's watermark</p>
  <video id="storyPreview" class="hidden" playsinline controls style="width:100%;max-height:180px;margin-top:8px;border-radius:12px;background:#000"></video>
  <input type="file" id="jStoryFile" accept="video/*" class="hidden"/>
  </div>`,async()=>{
    const photos=[];for(const f of Array.from(document.getElementById("jPh").files||[]))photos.push(await fileURL(f));
    let voice=null;const vf=document.getElementById("jV").files?.[0];if(vf)voice=await fileURL(vf);
    let story=null;
    let sblob=window._pendingStoryBlob||pendingStory;
    const sf=document.getElementById("jStoryFile")?.files?.[0];
    if((!sblob||!(sblob instanceof Blob))&&sf)sblob=sf;
    if(sblob&&sblob instanceof Blob){
      if(sblob.size>80e6){toast("Video too large");return;}
      const mid=uid("vid");
      await mediaPut(mid,sblob);
      story="idb:"+mid;
    }else if(typeof pendingStory==="string"){story=pendingStory;}
    let lat=null,lng=null;try{const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:4000}));lat=pos.coords.latitude;lng=pos.coords.longitude;}catch(e){}
    const campName=document.getElementById("jCamp")?.value||"";
    const km=document.getElementById("jKm")?.value||"";
    const fuelNote=document.getElementById("jFuel")?.value||"";
    const wildlife=document.getElementById("jWild")?.value||"";
    const campsite=readCamp("jC_");
    patch(t=>t.days.push(blankDay({date:document.getElementById("jD").value,time:document.getElementById("jT").value,title:document.getElementById("jH").value,place:document.getElementById("jP").value||campName,notes:document.getElementById("jN").value,photos,voice,story,lat,lng,campName,km,fuelNote,wildlife,kind:"note",poiType:_poiPick,campsite})));
  });
    setTimeout(()=>{
      bindPoiRow(document.getElementById("modalRoot"));
      const prev=document.getElementById("storyPreview"), st=document.getElementById("jStoryStatus");
      document.getElementById("jStoryStart")?.addEventListener("click",async()=>{
        const blob=await openPhoneCamera();
        if(blob){window._pendingStoryBlob=blob;pendingStory=blob;if(prev){prev.src=URL.createObjectURL(blob);prev.classList.remove("hidden");prev.controls=true;}if(st)st.textContent="Clip ready ("+(blob.size/1e6).toFixed(1)+" MB)";}
      });
      document.getElementById("jStoryStop")?.addEventListener("click",async()=>{const blob=await stopStoryRec(prev,st);if(blob){pendingStory=blob;window._pendingStoryBlob=blob;}});
      document.getElementById("jStoryFile")?.addEventListener("change",async e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>80e6){toast("Video too large (max ~80MB)");return;}pendingStory=f;window._pendingStoryBlob=f;prev.src=URL.createObjectURL(f);prev.classList.remove("hidden");prev.controls=true;st.textContent="Clip attached ("+(f.size/1e6).toFixed(1)+" MB)";});
    },50);
  };
  document.getElementById("addDay")?.addEventListener("click",()=>openDay(""));
  document.querySelectorAll("[data-prompt]").forEach(e=>e.onclick=()=>openDay(e.dataset.prompt));
  document.querySelectorAll("[data-del-day]").forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();patch(t=>t.days=t.days.filter(d=>d.id!==b.dataset.delDay));});
  document.querySelectorAll("[data-share-day]").forEach(b=>b.onclick=()=>{const t=T(),d=t.days.find(x=>x.id===b.dataset.shareDay);if(d)shareBranded(d,t);});
  document.querySelectorAll("[data-share-story]").forEach(b=>b.onclick=()=>{const t=T(),d=t.days.find(x=>x.id===b.dataset.shareStory);if(d)shareStoryFile(d,t);});

  document.querySelectorAll("[data-pack]").forEach(c=>c.onchange=()=>patch(t=>{const i=t.packing.find(x=>x.id===c.dataset.pack);if(i)i.done=c.checked;}));
  document.querySelectorAll("[data-del-pack]").forEach(b=>b.onclick=()=>patch(t=>t.packing=t.packing.filter(i=>i.id!==b.dataset.delPack)));
  document.getElementById("packApply")?.addEventListener("click",()=>{const list=S.lists.find(L=>L.id===document.getElementById("packLoad").value);if(!list)return toast("Pick list");patch(t=>{t.packing=list.items.map(i=>({id:uid("p"),cat:i.cat,name:i.name,done:false}));t.packingName=list.name;});});
  document.getElementById("packAdd")?.addEventListener("click",()=>{const n=document.getElementById("pn").value.trim();if(!n)return;patch(t=>t.packing.push({id:uid("p"),cat:document.getElementById("pc").value||"General",name:n,done:false}));});

  document.getElementById("addExp")?.addEventListener("click",()=>{const t=T();modal("Expense",`<div class="row"><div class="field" style="flex:1"><label>Amount</label><input type="number" step="0.01" id="eA"/></div>
  <div class="field" style="flex:1"><label>Currency</label><input id="eC" value="${esc(t.currency)}"/></div></div>
  <div class="field"><label>Category</label><select id="eCat"><option>Food & drink</option><option>Stay</option><option>Fuel</option><option>Flights</option><option>Activities</option><option>Shopping</option><option>Other</option></select></div>
  <div class="field"><label>Vendor</label><input id="eV"/></div><div class="field"><label>Date</label><input type="date" id="eD" value="${new Date().toISOString().slice(0,10)}"/></div>
  <div class="field"><label><input type="checkbox" id="eS"/> Split</label></div>
  <div class="field"><label>Receipt</label><input type="file" id="eR" accept="image/*" capture="environment"/></div>`,async()=>{
    let receipt=null;const f=document.getElementById("eR").files?.[0];if(f)receipt=await fileURL(f);
    patch(tr=>tr.expenses.push({id:uid("e"),amount:+document.getElementById("eA").value||0,currency:document.getElementById("eC").value,category:document.getElementById("eCat").value,vendor:document.getElementById("eV").value,date:document.getElementById("eD").value,note:"",split:document.getElementById("eS").checked,receipt}));
  });});
  document.querySelectorAll("[data-del-exp]").forEach(b=>b.onclick=()=>patch(t=>t.expenses=t.expenses.filter(e=>e.id!==b.dataset.delExp)));
  document.getElementById("addDoc")?.addEventListener("click",()=>modal("Document",`<div class="field"><label>Title</label><input id="doT"/></div>
  <div class="field"><label>Kind</label><select id="doK"><option>passport</option><option>visa</option><option>insurance</option><option>booking</option><option>other</option></select></div>
  <div class="field"><label>File</label><input type="file" id="doF" accept="image/*,application/pdf"/></div>`,async()=>{
    let data=null;const f=document.getElementById("doF").files?.[0];if(f)data=await fileURL(f);
    patch(t=>{t.docs=t.docs||[];t.docs.push({id:uid("doc"),title:document.getElementById("doT").value||"Doc",kind:document.getElementById("doK").value,note:"",data});});
  }));
  document.querySelectorAll("[data-del-doc]").forEach(b=>b.onclick=()=>patch(t=>t.docs=t.docs.filter(d=>d.id!==b.dataset.delDoc)));
  
  document.getElementById("addStoryClip")?.addEventListener("click",()=>{
    const t=T();if(!t)return;
    modal("Storyline clip",`<div class="field"><label>Title</label><input id="scTitle" placeholder="Sunset at the dunes"/></div>
    <div class="field"><label>Place</label><input id="scPlace"/></div>
    <div class="field"><label>Date</label><input type="date" id="scDate" value="${new Date().toISOString().slice(0,10)}"/></div>
    <div class="field"><label>Video</label>
      <button type="button" class="btn btn-soft" id="scRec" style="width:100%">Open camera — record / flip / gallery</button>
      <p class="meta" id="scStatus">Full-screen camera · max 3 min</p>
      <video id="storyPreview" class="hidden" playsinline controls style="width:100%;max-height:180px;margin-top:8px;border-radius:12px;background:#000"></video>
      <input type="file" id="scFile" accept="video/*" class="hidden"/>
    </div>`,async()=>{
      let blob=window._pendingStoryBlob;
      const f=document.getElementById("scFile")?.files?.[0];
      if(!blob&&f)blob=f;
      if(!blob){toast("Add a video first");return;}
      if(blob.size>80e6){toast("Video too large");return;}
      const mid=uid("vid");
      await mediaPut(mid, blob instanceof Blob?blob:new Blob([blob],{type:blob.type||"video/mp4"}));
      patch(tr=>{tr.storyline=tr.storyline||[];tr.storyline.push({id:uid("clip"),media:"idb:"+mid,title:document.getElementById("scTitle").value||"Clip",place:document.getElementById("scPlace").value,date:document.getElementById("scDate").value});});
      toast("Clip added to storyline");
    });
    setTimeout(()=>{
      const prev=document.getElementById("storyPreview"), st=document.getElementById("scStatus");
      window._pendingStoryBlob=null;
      document.getElementById("scRec")?.addEventListener("click",async()=>{
        const blob=await openPhoneCamera();
        if(blob){window._pendingStoryBlob=blob;if(prev){prev.src=URL.createObjectURL(blob);prev.classList.remove("hidden");prev.controls=true;}if(st)st.textContent="Clip ready ("+(blob.size/1e6).toFixed(1)+" MB)";}
      });
      document.getElementById("scStop")?.addEventListener("click",()=>stopStoryRec(prev,st));
      document.getElementById("scFile")?.addEventListener("change",e=>{
        const f=e.target.files?.[0];if(!f)return;
        if(f.size>80e6){toast("Too large");return;}
        window._pendingStoryBlob=f;prev.src=URL.createObjectURL(f);prev.classList.remove("hidden");prev.controls=true;st.textContent="Clip ready";
      });
    },40);
  });
  document.getElementById("playStoryline")?.addEventListener("click",()=>{
    const vids=[...document.querySelectorAll("#storylineReel video")];
    if(!vids.length){toast("No clips yet");return;}
    let i=0;
    const playNext=()=>{
      if(i>=vids.length){toast("Storyline finished");return;}
      vids.forEach((v,j)=>{if(j!==i){try{v.pause();}catch(e){}}});
      const v=vids[i];
      v.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
      const go=()=>{v.play().catch(()=>{});};
      if(!v.src&&v.getAttribute("data-media"))hydrateVideos(document.getElementById("storylineReel")).then(go);else go();
      v.onended=()=>{i++;playNext();};
    };
    playNext();
  });
  document.querySelectorAll("[data-del-clip]").forEach(b=>b.onclick=()=>patch(t=>{t.storyline=(t.storyline||[]).filter(c=>c.id!==b.dataset.delClip);}));
  document.querySelectorAll("[data-share-clip]").forEach(b=>b.onclick=()=>{
    const t=T();const c=allStoryClips(t).find(x=>x.id===b.dataset.shareClip);
    if(c)shareStoryFile({story:c.media,title:c.title,place:c.place,date:c.date,photos:[]},t);
  });

  document.getElementById("btnPrint")?.addEventListener("click",()=>window.print());
  document.getElementById("qcFromEmpty")?.addEventListener("click",()=>openQuickCapture());
  document.getElementById("qcFromStory")?.addEventListener("click",()=>openQuickCapture());
  document.getElementById("qcCheckinFromMap")?.addEventListener("click",()=>ensureTrip(()=>qcCheckin()));
  document.getElementById("btnTrailEmpty")?.addEventListener("click",()=>document.getElementById("btnTrail")?.click());
  document.getElementById("bulkPhotos")?.addEventListener("click",()=>ensureTrip(()=>qcBulkPhotos()));
  document.getElementById("bulkFromEmpty")?.addEventListener("click",()=>ensureTrip(()=>qcBulkPhotos()));

  /* Community bindings */
  document.querySelectorAll("[data-soc-tab]").forEach(b=>b.onclick=()=>{S.communityTab=b.dataset.socTab;S.socView=null;render();});
  document.querySelectorAll("[data-open-pub]").forEach(b=>b.onclick=()=>{S.screen="community";S.socView="publicTrip";S.socTripId=b.dataset.openPub;S.forkSel={days:{},stops:{}};S.shareToken=null;render();});
  document.querySelectorAll("[data-open-profile]").forEach(b=>b.onclick=()=>{S.screen="community";S.socView="profile";S.socProfileId=b.dataset.openProfile;render();});
  document.querySelectorAll("[data-follow]").forEach(b=>b.onclick=()=>{const a=C();if(!a)return;const id=b.dataset.follow;if(a.isFollowing(id))a.unfollow(id);else a.follow(id);render();});
  document.querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>{const a=C();if(!a)return;const other=b.dataset.dm;if(other===a.me().id)return;S.dmOtherId=other;S.dmThreadId=a.openThreadWith(other);S.screen="community";S.socView="dm";S.communityTab="messages";render();});
  document.querySelectorAll("[data-open-dm]").forEach(b=>b.onclick=()=>{S.dmThreadId=b.dataset.openDm;S.dmOtherId=b.dataset.dmOther;S.socView="dm";render();});
  document.querySelectorAll("[data-react-feed]").forEach(b=>b.onclick=()=>{const a=C();if(!a)return;a.reactFeed(b.dataset.reactFeed,b.dataset.emoji||"❤️");render();});
  document.querySelectorAll("[data-react-trip]").forEach(b=>b.onclick=()=>{const a=C();if(!a)return;a.reactTrip(b.dataset.reactTrip,b.dataset.emoji||"❤️");render();});
  document.getElementById("socBack")?.addEventListener("click",()=>{S.socView=null;S.socTripId=null;S.socProfileId=null;render();});
  document.getElementById("socBackDm")?.addEventListener("click",()=>{S.socView=null;S.dmThreadId=null;S.communityTab="messages";render();});
  document.getElementById("cmtSend")?.addEventListener("click",()=>{
    const a=C();if(!a||!S.socTripId)return;const text=(document.getElementById("cmtText")?.value||"").trim();
    if(!text){toast("Write a comment");return;}a.addComment(S.socTripId,text);render();toast("Comment posted");
  });
  document.getElementById("socBackShare")?.addEventListener("click",()=>{S.socView=null;S.shareToken=null;S.socTripId=null;S.screen="home";if(location.hash)history.replaceState(null,"",location.pathname+location.search);render();});
  document.getElementById("socBackShare2")?.addEventListener("click",()=>{document.getElementById("socBackShare")?.click();});
  document.querySelectorAll("[data-fork-day]").forEach(inp=>inp.onchange=()=>{S.forkSel=S.forkSel||{days:{},stops:{}};S.forkSel.days[inp.dataset.forkDay]=inp.checked;});
  document.querySelectorAll("[data-fork-stop]").forEach(inp=>inp.onchange=()=>{S.forkSel=S.forkSel||{days:{},stops:{}};S.forkSel.stops[inp.dataset.forkStop]=inp.checked;});
  document.getElementById("btnForkTrip")?.addEventListener("click",()=>forkIntoDraft(S.forkSource));
  document.getElementById("cfSave")?.addEventListener("click",()=>{
    const a=C();if(!a||!a.setCloseFriends)return;
    const ids=[...document.querySelectorAll("[data-cf]:checked")].map(x=>x.dataset.cf);
    a.setCloseFriends(ids);toast("Close friends updated");render();
  });
  document.querySelectorAll(".audience-opt").forEach(lab=>{
    lab.addEventListener("click",()=>{
      const inp=lab.querySelector('input[type="radio"]');
      if(!inp)return;
      document.querySelectorAll(".audience-opt").forEach(x=>x.classList.remove("on"));
      lab.classList.add("on");
    });
  });
  document.getElementById("dmSend")?.addEventListener("click",()=>{
    const a=C();if(!a||!S.dmThreadId)return;const text=(document.getElementById("dmText")?.value||"").trim();
    if(!text)return;a.sendMessage(S.dmThreadId,S.dmOtherId,text);render();
  });
  document.getElementById("dmText")?.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();document.getElementById("dmSend")?.click();}});
  document.getElementById("rvSave")?.addEventListener("click",()=>{
    const a=C();if(!a)return;
    const name=(document.getElementById("rvName")?.value||"").trim();
    if(!name){toast("Name the place");return;}
    a.addReview({placeName:name,placeType:document.getElementById("rvType").value,stayType:document.getElementById("rvType").value,
      rating:+document.getElementById("rvRate").value||5,dates:document.getElementById("rvDates").value,
      amenities:(document.getElementById("rvAm").value||"").split(",").map(x=>x.trim()).filter(Boolean),
      text:document.getElementById("rvText").value||""});
    toast("Review added");render();
  });
  document.getElementById("rvFromStay")?.addEventListener("click",()=>{
    const stays=S.trips.flatMap(t=>(t.stays||[]).map(s=>({trip:t,stay:s})));
    if(!stays.length){toast("Log a stay on a trip first");return;}
    const opts=stays.map((x,i)=>`<option value="${i}">${esc(x.stay.name)} · ${esc(x.trip.name)}</option>`).join("");
    modal("Review a stay",`<div class="field"><label>Stay</label><select id="pickStay">${opts}</select></div>
    <div class="field"><label>Rating</label><select id="pickRate">${[5,4,3,2,1].map(n=>`<option value="${n}">${n}</option>`).join("")}</select></div>
    <div class="field"><label>Review</label><textarea id="pickRev" placeholder="What should the next traveler know?"></textarea></div>`,()=>{
      const a=C();if(!a)return;const x=stays[+document.getElementById("pickStay").value];if(!x)return;
      const s=x.stay;const text=document.getElementById("pickRev").value||s.review||"";
      const rating=+document.getElementById("pickRate").value||s.rating||5;
      a.addReview({placeName:s.name,placeType:s.type==="camp"?"camp":"hotel",stayType:s.type,rating,text,
        amenities:(s.amenities||"").split(",").map(v=>v.trim()).filter(Boolean),dates:[s.checkIn,s.checkOut].filter(Boolean).join(" → ")});
      s.rating=rating;if(text)s.review=text;save();toast("Review published");S.communityTab="reviews";render();
    });
  });
  document.getElementById("meSave")?.addEventListener("click",()=>{
    const a=C();if(!a)return;
    a.updateMe({displayName:document.getElementById("meName").value.trim()||"You",homeBase:document.getElementById("meHome").value.trim(),
      bio:document.getElementById("meBio").value,avatar:document.getElementById("meAv").value.trim()||"🌿"});
    toast("Profile saved");render();
  });
  document.getElementById("sbSave")?.addEventListener("click",()=>{
    const url=(document.getElementById("sbUrl")?.value||"").trim();
    const anonKey=(document.getElementById("sbKey")?.value||"").trim();
    if(!url||!anonKey){toast("Need URL and anon key");return;}
    WikilogsCommunity.setCfg({url,anonKey});WikilogsCommunity.resolveAdapter();toast("Supabase config saved");render();
  });
  document.getElementById("sbClear")?.addEventListener("click",()=>{WikilogsCommunity.setCfg(null);WikilogsCommunity.resolveAdapter();toast("Using demo community");render();});
  document.getElementById("sbReset")?.addEventListener("click",()=>{if(!confirm("Reset demo community data?"))return;C().resetDemo();toast("Demo reset");render();});

  if(S.tab==="map"||(T()?.viewMode==="map"&&S.tab==="map"))setTimeout(()=>initMap(T()),80);
  if(S.tab==="map")setTimeout(()=>initMap(T()),80);
  setTimeout(()=>{try{if(typeof hydrateVideos==="function")hydrateVideos(document.getElementById("app"));}catch(e){}},40);
}
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadController)location.reload();});
}
function applyShareHash(){
  const tok=parseShareHash();
  if(!tok)return false;
  S.screen="community";S.socView="shareTrip";S.shareToken=tok;S.forkSel={days:{},stops:{}};
  return true;
}
load();
applyShareHash();
render();
window.addEventListener("hashchange",()=>{
  if(applyShareHash())render();
  else if(S.socView==="shareTrip"){S.socView=null;S.shareToken=null;render();}
});
})();
</script>
</body>
</html>
